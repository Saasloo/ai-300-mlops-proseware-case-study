[project]
name = "ai-300-mlops-proseware-case-study"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "luizamfsantos", email = "luiza.marques_@hotmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "azure-ai-ml>=1.34.1",
    "azure-identity>=1.25.3",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "kagglehub>=0.3.13",
    "pandas>=3.0.5",
    "python-dotenv>=1.1.0",
]

[project.scripts]
ai-300-mlops-proseware-case-study = "proseware:main"
ingest-kaggle-dataset = "proseware.ingestion.kaggle:main"
submit-ingest-job = "proseware.ingestion.pipeline:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "proseware"

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
    "pre-commit>=4.6.1",
]
